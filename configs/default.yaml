nodes:
  n_excitatory: 4000
  n_pv: 350
  n_sst: 350
  n_vip: 300

  spatial:
    dimensions: 3
    volume_size: [1.0, 1.0, 1.0]

  basal_tau: 10.0
  apical_tau: 20.0
  basal_activation: softplus
  apical_center: 1.0
  apical_slope: 1.0
  noise_std: 0.01
  dt: 1.0

  ip_enabled: true
  ip_learning_rate: 0.0001
  ip_target_rate: 0.05
  ip_tau: 1000.0

edges:
  connectivity:
    driving:
      p_max: 0.3
      sigma: 0.15
      source_types: [EXCITATORY]
      target_types: [EXCITATORY]
      plastic: true
    modulatory:
      p_max: 0.2
      sigma: 0.25
      source_types: [EXCITATORY]
      target_types: [EXCITATORY]
      plastic: true
    inhib_perisomatic:
      p_max: 0.5
      sigma: 0.10
      source_types: [PV]
      target_types: [EXCITATORY]
      plastic: true
    inhib_dendritic:
      p_max: 0.4
      sigma: 0.12
      source_types: [SST]
      target_types: [EXCITATORY, VIP]
      plastic: true
    electrical:
      p_max: 0.3
      sigma: 0.05
      source_types: [PV]
      target_types: [PV]
      plastic: false
    retrograde:
      p_max: 0.1
      sigma: 0.15
      source_types: [EXCITATORY]
      target_types: [EXCITATORY]
      plastic: true
    max_radius: 0.5

  stdp:
    enabled: true
    learning_rate: 0.01
    tau_plus: 20.0
    tau_minus: 20.0
    a_plus: 0.005
    a_minus: 0.00525
    w_min: 0.0
    w_max: 1.0
    update_interval: 1

  homeostatic:
    enabled: true
    tau: 10000.0
    target_rate: 0.05
    update_interval: 100

  stp:
    enabled: true
    tau_facilitation: 500.0
    tau_depression: 200.0
    U_baseline: 0.2

  structural:
    enabled: true
    update_interval: 500
    growth_rate: 0.1
    prune_threshold: 0.01
    edge_cost: 0.00001
    max_degree: 5000

simulation:
  seed: 42
  n_steps: 10000
  record_interval: 100
  device: auto
  log_interval: 100
  checkpoint_interval: 1000
  checkpoint_dir: checkpoints

viz:
  enabled: true
  update_interval: 50
  node_color_field: output
  show_edges: false
  max_edges_displayed: 5000
